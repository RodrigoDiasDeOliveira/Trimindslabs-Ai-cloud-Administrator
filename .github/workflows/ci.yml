name: AI Cloud Administrator CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
